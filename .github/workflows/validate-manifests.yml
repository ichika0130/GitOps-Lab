name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Render Kustomize manifests
        run: kubectl kustomize manifests > rendered.yaml

      - name: Validate Kubernetes objects
        uses: yannh/kubeconform-action@v0.6.7
        with:
          files: rendered.yaml
          strict: true
