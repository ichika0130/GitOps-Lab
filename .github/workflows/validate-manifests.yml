name: Validate and Test Kubernetes Manifests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Render Kustomize manifests
        run: kubectl kustomize manifests/overlays/prod > rendered.yaml

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: gitops-lab-ci

      - name: Prepare validation namespace
        run: kubectl create namespace gitops-lab --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Kubernetes objects
        run: kubectl apply --dry-run=server -f rendered.yaml

      - name: Deploy manifests
        run: kubectl apply -k manifests/overlays/prod

      - name: Wait for rollout
        run: kubectl -n gitops-lab rollout status deployment/nginx-deployment --timeout=120s

      - name: Show deployed resources
        run: kubectl -n gitops-lab get deployment,pods,svc

      - name: Smoke test NGINX service
        run: |
          kubectl -n gitops-lab port-forward svc/nginx-service 8080:80 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ | grep -qi "Welcome to nginx"; then
              exit 0
            fi

            sleep 2
          done

          curl -v http://127.0.0.1:8080/
          exit 1
