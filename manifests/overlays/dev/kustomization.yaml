apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitops-lab-dev
resources:
  - ../../base
  - namespace.yaml
replicas:
  - name: nginx-deployment
    count: 1
patches:
  - path: deployment-labels.yaml
  - path: service-labels.yaml
  - target:
      kind: Service
      name: nginx-service
    path: nodeport-patch.yaml
